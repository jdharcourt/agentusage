name: macOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift test
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: AgentUsage-macOS
          path: dist/AgentUsage-macOS.zip
          if-no-files-found: error
